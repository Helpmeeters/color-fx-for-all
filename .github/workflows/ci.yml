name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  tests:
    name: Tests (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.14
      - name: Install Home Assistant test harness (${{ matrix.channel }})
        run: |
          if [ "${{ matrix.channel }}" = "beta" ]; then
            uv pip install --prerelease=allow pytest-homeassistant-custom-component
          else
            uv pip install pytest-homeassistant-custom-component
          fi
      - run: uv run python -c "import homeassistant.const as c; print(c.__version__)"
      - run: uv run pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - run: ruff format --check

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
