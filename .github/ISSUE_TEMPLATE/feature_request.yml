name: Feature request
description: Suggest a sequence, an effect, or something a Color FX Hub should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the room, occasion, or situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: colors
    attributes:
      label: Colors or sequence
      description: For a new sequence, the colors you have in mind (names or hex codes) and the order they should play in.
